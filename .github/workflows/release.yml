name: Release

# v* etiketi atılınca tek dosyalık (.NET dahil) linux-x64 sürümünü derleyip Release'e ekler.
# Sürüm numarasının tek kaynağı etikettir: derleme, csproj'daki sürümü etiketten (-p:Version) ezer.
# Etiketi elle atmak yerine scripts/release.sh kullanın (csproj'u günceller, commit + etiket + push yapar).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Sürümü etiketten al
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Yayınla
        run: >
          dotnet publish DroidPad.csproj -c Release -r linux-x64 -o out
          -p:Version="$VERSION" -p:InformationalVersion="$VERSION+${GITHUB_SHA::7}"
      - name: Varlıkları hazırla
        run: |
          cp out/DroidPad DroidPad-linux-x64
          sha256sum DroidPad-linux-x64 > DroidPad-linux-x64.sha256
      - name: Release oluştur / güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" DroidPad-linux-x64 DroidPad-linux-x64.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" DroidPad-linux-x64 DroidPad-linux-x64.sha256 \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
