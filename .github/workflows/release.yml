name: Release

# v* etiketi atılınca tek dosyalık (.NET dahil) linux-x64 sürümünü derleyip Release'e ekler.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Yayınla
        run: dotnet publish DroidPad.csproj -c Release -r linux-x64 -o out
      - name: Varlıkları hazırla
        run: |
          cp out/DroidPad DroidPad-linux-x64
          sha256sum DroidPad-linux-x64 > DroidPad-linux-x64.sha256
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DroidPad-linux-x64 DroidPad-linux-x64.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
